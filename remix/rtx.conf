# Devil May Cry 4 (DX9) through RTX Remix with dmc4_hook's Remix bridge (Graphics tab > RTX Remix bridge), which sets the
# camera (view / projection from sCamera) and skips the depth prepass, shadow / reflection views and screen filters.
# DMC4 skins and transforms everything in vertex shaders: vertex capture reads each vertex's clip position and puts it
# back in the world with that camera.
rtx.useVertexCapture = True
rtx.useVertexCapturedNormals = True
rtx.enableAlwaysCalculateAABB = True
# the HUD and menus are drawn with orthographic projections
rtx.orthographicIsUI = True
# a distant light only while the game gives Remix none (dmc4_hook's bridge hands it the stage's sun)
rtx.fallbackLightMode = 1
rtx.fallbackLightDirection = -0.85, -0.35, 0.25
rtx.fallbackLightRadiance = 1.6, 1.5, 1.4
rtx.fallbackLightAngle = 5
# DMC4 materials: albedo on stage 0; the stages after it are normal / mask / lightmap maps, not colours
rtx.ignoreLastTextureStage = True
rtx.legacyMaterial.useAlbedoTextureIfPresent = True
rtx.keepTexturesForTagging = True
rtx.geometryAssetHashRuleString = positions,geometrydescriptor
# Remix's default generation rule (2026-11-24): the narrowed "positions,geometrydescriptor" left every draw's index and
# UV hashes empty (d3d9_rtx_geometry.cpp hashes them only when the rule names them), so Remix told a model's draws
# apart by positions, counts and shader constants alone, and a character's parts (2B: 14+ draws from one vertex
# buffer) were matched to each other's objects: the body showed stale geometry, offset from the hair, for seconds.
rtx.geometryGenerationHashRuleString = positions,indices,texcoords,geometrydescriptor,vertexlayout,vertexshader
rtx.enableReplacementAssets = True
rtx.defaultToAdvancedUI = True
dxvk.logLevel = debug
# water: the bridge's stand-in texture (every water surface) as animated water, with Remix's layered water normals
rtx.opaqueMaterial.layeredWaterNormalEnable = True
rtx.animatedWaterTextures = 0x815203BE4DC25162, 0x60303FF3AECB4642, 0x2FFB6918C12C256E, 0x257B09A147B82A19, 0x0ACE46F436596399, 0x345E0936BFE4844B, 0x8C52ACE6575EA844, 0x6E84E40F4EBD7253, 0x3B44B3DB4EF8E6EB, 0x768730A60B5AC159, 0x274F2A395F294722, 0x5A76F6B15E501200
# the bridge hands Remix's image to the game before its transparent pass: the game's own eye adaptation, bloom and tone map
# then run on it, so Remix's must not (two auto exposures fought: the lighting snapped)
rtx.autoExposure.enabled = False
rtx.bloom.enable = False
# lights added to tagged textures (Add Light to Texture): the bridge sets a white D3D material, this gives the colour
rtx.effectLightColor = 1.0, 0.72, 0.42
rtx.effectLightIntensity = 1.0
rtx.effectLightRadius = 5
# DMC4 culls what's off screen, so with vertex capture Remix's scene held only what this frame drew: shadows, bounce
# light and light leaks changed with the view direction. Anti-culling keeps objects (and texture lights) that
# leave the view in Remix's scene.
# Object anti-culling off (2026-11-24): it judges whether an object left the view by its bounding box, which for
# meshes skinned in a vertex shader is the bind pose at the world origin, not where the character is. When Remix
# failed to match one of a character's meshes to last frame's, the old copy looked culled and stayed, frozen where the
# character had been (2B's head and green parts trailing her for seconds). The bridge's "Draw what's off screen too"
# makes the game draw every model of the room instead.
rtx.antiCulling.object.enable = False
rtx.antiCulling.light.enable = True
# Opacity micromaps off (2026-11-25): with them on, alpha-tested surfaces came out too opaque (the street litter decals
# in room 12 drew as black patches, leaves cast solid shadows), and the frame was 20 % slower (23.5 vs 28.3 fps on an
# RTX 3070 Ti laptop, 4 of 4 alternating rounds). Without them Remix tests the alpha texture at every hit.
rtx.opacityMicromap.enable = False
# Culling off (2026-11-25): Remix back-face culled whole triangles that the game draws (black triangles on room 12's
# pickups: the hood, the tarp; they were holes onto the unlit inside). With culling off they're whole.
rtx.enableCulling = False
# Texture filtering (2026-11-25, tuned with the user): DLSS renders at a third of the screen here, so distant textures
# (water, walls) picked mips for a small screen and blurred; a negative upscaling mip bias and 16x anisotropic
# filtering sharpen them. If textures shimmer in motion, move the bias toward 0.
rtx.maxAnisotropySamples = 16
rtx.upscalingMipBias = -1
rtx.skyBoxTextures = 0x07448000ED76A54A, 0x11726002298AF114, 0x12A185968F249601, 0x211BC6172003B2F2, 0x409D49B0964F8080, 0x46A9FA69CD522F6A, 0x50137A612FED6B36, 0x5C5EC01AF4C3B8B4, 0x6CB81FFE8BAF801A, 0x872FEF2FF832623A, 0x9DC39F0E0536064C, 0xA7D0EB0E5E75FDE2, 0xA8DD21F9F107908F, 0xB5779C5B254BE3F9, 0xC3520FAD20C6E7EA, 0xC63E435A7BC4AC38, 0xD06BF223B9D349D8, 0xD0D745D6510F6B8F, 0xD3559C84D7F9AEEE, 0xD9F5BE6ADD82AEEB, 0xE6B718E85C61DC04, 0xF035C56B620D0D51, 0xF5E35EE9C0C7F96C, 0xF686A8FDE62DC34D, 0x64A9912B87359FB7, 0x76C52F6CA7E1BD5A
